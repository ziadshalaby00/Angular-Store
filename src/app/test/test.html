<!-- Test Component -->
<div class="min-h-[90vh] p-6 flex flex-col items-center justify-evenly gap-4">
    @for(item of inputStyls; track item) {
      <ZS-select
        [required]="true"
        [inputStyle]="item"
        [label]="item"
        [items]="brandService.brands()"
        placeholder="Select a brand..."
        [searchDebounceDelay]="1"
        searchPlaceholder="Search brands...">
      </ZS-select>
    }
</div>
