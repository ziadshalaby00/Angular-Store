<!-- ---- Categories Carousel ---- -->
<div class="my-8">
    <div class="flex justify-evenly gap-4 flex-wrap pb-2">
        @for (cat of categoryService.categories(); track cat.id) {
        <div class="flex-shrink-0 cursor-pointer flex flex-col text-center justify-center items-center group">
            <div class="size-45 rounded-full overflow-hidden border-2 border-gray-200 mb-2">
                <img 
                    [src]="configService.apiUrl + cat.image"
                    alt="{{cat.name}}"
                    loading="lazy"
                    class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105 transform-gpu will-change-transform"
                >
            </div>

            <!-- Name -->
            <p class="text-sm font-medium text-gray-700 group-hover:text-blue-600">
            {{ cat.name }}
            </p>
        </div>
        }
    </div>
</div>
