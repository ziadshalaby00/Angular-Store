<!-- date.html -->
<div class="w-full">
  <!-- Label and Hint -->
  <ZS-label
    [label]="label()"
    [hint]="hint()"
    [required]="required()"
    [hintID]="id() + '-hint'"
    [for]="id()"
  >
  </ZS-label>

  <div class="relative rounded-lg shadow-sm w-full px-4 py-2.5 pl-10 pr-4"
  [class]="inputClasses()"
  >
    <input
      [name]="name()"
      [id]="id()"
      [type]="inputType()"
      [value]="value() ?? ''"
      (input)="onInputChange($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [readonly]="readonly()"
      [required]="required()"
      
      class="appearance-none outline-none"
    />

    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
      <i class="fas {{ icon() }} text-gray-400 dark:text-gray-500"></i>
    </div>
  </div>
</div>
