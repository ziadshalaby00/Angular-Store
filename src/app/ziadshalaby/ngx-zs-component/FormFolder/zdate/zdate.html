<!-- date.html -->
<div class="w-full">
  <!-- Label and Hint -->
  @if(label() || hint()) {
    <div class="mb-1 flex items-center gap-2">
      @if (label()) {
        <span class="text-sm font-semibold truncate">
          {{ label() }} @if (required()) { <span class="text-red-500">*</span> }
        </span>
      }
      @if (hint()) {
        <small class="text-xs text-slate-500 dark:text-slate-400">{{ hint() }}</small>
      }
    </div>
  }

  <div class="relative rounded-lg shadow-sm w-full px-4 py-2.5 pl-10 pr-4"
  [class]="inputClasses()"
  >
    <input
      [id]="id()"
      [type]="inputType()"
      [value]="value() ?? ''"
      (input)="onInputChange($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [readonly]="readonly()"
      [required]="required()"
      
      class="appearance-none outline-none"
    />

    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
      <i class="fas {{ icon() }} text-gray-400 dark:text-gray-500"></i>
    </div>
  </div>
</div>
