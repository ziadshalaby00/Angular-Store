<!-- ========================= Overlay ========================= -->
@if (isOpen()) {
  <div #modalRef
    class="fixed inset-0 flex z-[999] bg-black/50 dark:bg-black/70 transition-all duration-300"
    [class]="positionClass()"
    (click)="onOverlayClick($event)"
    role="presentation"
    [attr.inert]="isOpen() ? null : ''"
  >

    <!-- ========================= Modal Container ========================= -->
    <div
      class="relative m-4 bg-white dark:bg-slate-900 w-full max-w-lg mx-4 rounded-2xl shadow-lg transition-all duration-300 outline-none"
      [class]="'border ' + palette().border + ' ' + palette().text"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="'modal-title'"
      [attr.aria-describedby]="'modal-body'"
      tabindex="0"
      (keydown.escape)="close()"
    >

        <!-- ========================= Modal Header ========================= -->
        <div
            class="flex items-center justify-between px-4 py-3 border-b"
            [class]="palette().border"
        >
            <h3 id="modal-title" class="font-semibold text-lg">
            {{ title() }}
            </h3>
            @if(showCancelIcon()) {
                <button 
                class="text-xl hover:opacity-85 cursor-pointer transition-colors duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-500 rounded-md"
                [class]="palette().textHover"
                (click)="close()"
                aria-label="Close dialog"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>
            }
        </div>

        <!-- ========================= Modal Body ========================= -->
        <div id="modal-body" class="p-4">
            <ng-content></ng-content>
        </div>

        <!-- ========================= Modal Footer ========================= -->
        @if (showFooter()) {
            <div
            class="flex justify-end gap-3 p-4 border-t"
            [class]="palette().border"
            >
                @if (configMerged('cancel').show) {
                    <ZS-button
                    [btnStyle]="configMerged('cancel').style"
                    variant="solid"
                    type="button"
                    (clickedEv)="cancel.emit()"
                    [icon]="configMerged('cancel').icon"
                    [disabled]="configMerged('cancel').disabled"
                    [variant]="configMerged('cancel').variant"
                    aria-label="Cancel"
                    >
                        {{ configMerged('cancel').text}}
                    </ZS-button>
                }
                @if (configMerged('confirm').show) {
                    <ZS-button
                    type="button"
                    [btnStyle]="configMerged('confirm').style"
                    (clickedEv)="confirm.emit()"
                    [icon]="configMerged('confirm').icon"
                    [disabled]="configMerged('confirm').disabled"
                    [variant]="configMerged('confirm').variant"
                    aria-label="Confirm"
                    >
                        {{ configMerged('confirm').text}}
                    </ZS-button>
                }
            </div>
        }
    </div>
  </div>
}
