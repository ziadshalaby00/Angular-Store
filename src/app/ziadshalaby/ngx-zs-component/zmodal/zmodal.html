<!-- Overlay -->
@if (isOpen()) {
    <div
    class="fixed inset-0 flex items-center justify-center z-[999] bg-black/50 dark:bg-black/70 transition-all duration-300"
    (click)="onOverlayClick($event)"
    >
        <!-- Modal Content -->
        <div
            class="relative bg-white dark:bg-slate-900 w-full max-w-lg mx-4 rounded-2xl shadow-lg transition-all duration-300"
            [class]="'border ' + palette().border + ' ' + palette().text"
            (click)="$event.stopPropagation()"
        >
            <!-- Header -->
            <div
            class="flex items-center justify-between px-4 py-3 border-b"
            [class]="palette().border"
            >
                <h3 class="font-semibold text-lg">{{ title() }}</h3>
                <button
                    class="text-xl cursor-pointer transition-colors duration-200"
                    [class]="palette().textHover"
                    (click)="close()"
                    aria-label="Close"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Body -->
            <div class="p-4">
                <ng-content></ng-content>
            </div>

            <!-- Footer -->
            @if (showFooter()) {
                <div
                    class="flex justify-end gap-3 p-4 border-t"
                    [class]="palette().border"
                >
                    @if (cancelConfig().show) {
                        <ZS-button
                        [btnStyle]="cancelConfig().style ?? 'light'"
                        variant="solid"
                        type="button"
                        (clickedEv)="cancel.emit()"
                        >
                            {{ cancelConfig().text }}
                        </ZS-button>
                    }
                    @if (confirmConfig().show) {
                        <ZS-button
                        type="button"
                        [btnStyle]="confirmConfig().style ?? modalStyle()"
                        (clickedEv)="confirm.emit()"
                        >
                            {{ confirmConfig().text }}
                        </ZS-button>
                    }
                </div>
            }
        </div>
    </div>
}
