<!-- ========================= Top Spacing ========================= -->
<div class="mt-6"></div>

<!-- ========================= Total Items Count ========================= -->
@if (showTotalItems()) {
  <div
    class="text-center text-sm text-gray-500 dark:text-gray-300 mb-2"
    role="status"
    aria-live="polite"
  >
    {{ totalItemsMessage() }} {{ totalItems() }}
  </div>
}

<!-- ========================= Pagination Navigation ========================= -->
<nav
  class="flex flex-wrap justify-center items-center gap-1"
  role="navigation"
  aria-label="Pagination"
>
  <!-- ========================= Previous Button ========================= -->
  <button
    type="button"
    class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-blue-100 dark:hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200"
    (click)="prevPage()"
    [disabled]="currentPage() === 1"
    [attr.aria-disabled]="currentPage() === 1"
    aria-label="Go to previous page"
  >
    <i class="fas fa-chevron-left text-gray-600 dark:text-gray-200" aria-hidden="true"></i>
    <span class="sr-only">Previous</span>
  </button>

  <!-- ========================= Page Numbers ========================= -->
  @for (page of pages(); track page) {
    <button
      type="button"
      (click)="goToPage(page)"
      class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-blue-100 dark:hover:bg-blue-700 transition-all duration-200"
      [ngClass]="{
        'bg-blue-500 text-white dark:bg-blue-400 dark:text-black': page === currentPage()
      }"
      [attr.aria-current]="page === currentPage() ? 'page' : null"
      [attr.aria-label]="'Go to page ' + page"
    >
      {{ page }}
    </button>
  }

  <!-- ========================= Next Button ========================= -->
  <button
    type="button"
    class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-blue-100 dark:hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200"
    (click)="nextPage()"
    [disabled]="currentPage() === totalPages()"
    [attr.aria-disabled]="currentPage() === totalPages()"
    aria-label="Go to next page"
  >
    <i class="fas fa-chevron-right text-gray-600 dark:text-gray-200" aria-hidden="true"></i>
    <span class="sr-only">Next</span>
  </button>
</nav>
