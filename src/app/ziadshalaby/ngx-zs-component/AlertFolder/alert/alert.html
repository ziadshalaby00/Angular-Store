<!-- ========================= Alert Container ========================= -->
<div
  class="fixed ml-4 break-all z-[1000] flex flex-col overflow-y-auto custom-scrollbar p-2 space-y-3"
  [ngStyle]="maxHeightStyle"
  [ngClass]="positionClass()"
  role="region"
  aria-label="Notification area"
  aria-live="polite"
>

  @for (alert of alertConfig(); track alert.id) {

    <!-- ========================= Alert Card ========================= -->
    <div
      class="pointer-events-auto max-w-sm min-h-14 rounded-lg border p-4 shadow-md dark:shadow-gray-400/30
              transition-all duration-300 ease-in-out animate-fade-in relative overflow-hidden"
      [class]="alert.bgColor + ' ' + alert.textColor + ' ' + alert.borderColor"
      role="alert"
    >

      <!-- ========================= Alert Content ========================= -->
      <div class="flex items-center">

        <!-- Icon -->
        <i
          [class]="alert.icon + ' mt-0.5 me-3'"
          aria-hidden="true"
        ></i>

        <!-- Message -->
        <div class="flex-1 text-sm font-medium">
          {{ alert.message }}
        </div>

        <!-- Close Button -->
        @if (alert.showCloseButton ?? defaultShowCloseButton()) {
          <button
            type="button"
            class="ms-2 inline-flex h-6 w-6 items-center justify-center rounded-full
                    text-gray-500 dark:text-gray-300
                    hover:bg-gray-200 dark:hover:bg-gray-700
                    hover:text-gray-700 dark:hover:text-gray-100
                    focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
            (click)="closeAlert(alert.id!)"
            aria-label="Close alert"
          >
            <i class="fas fa-times text-xs" aria-hidden="true"></i>
          </button>
        }

      </div>

      <!-- ========================= Auto-Close Progress Bar ========================= -->
      @if (alert.autoClose ?? defaultAutoClose()) {
        <div
          class="absolute bottom-0 left-0 h-1 bg-gray-300 dark:bg-gray-700 w-full"
          role="progressbar"
          [attr.aria-valuenow]="alert.progress ?? 100"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div
            class="h-1 bg-current transition-[width] duration-100"
            [style.width.%]="alert.progress ?? 100"
          ></div>
        </div>
      }

    </div>

  }

</div>
