<!-- ========================= Overlay ========================= -->
@if (isOpen()) {
  <div #modalRef
    class="fixed inset-0 flex {{ zIndices.modal }} bg-black/50 dark:bg-black/70 transition-all duration-300"
    [ngClass]="[positionClass(), open() ? 'animate-fadeIn' : 'animate-fadeOut']"
    (click)="onOverlayClick($event)"
    role="presentation"
    [attr.inert]="isOpen() ? null : ''"
  >

    <!-- ========================= Modal Container ========================= -->
    <div
      class="relative m-4 bg-white dark:bg-slate-900 w-full max-w-lg mx-4 
      rounded-2xl shadow-lg transition-all duration-300 outline-none"
      [ngClass]="[
        'border', 
        palette().border,
        palette().text,
        open() ? 'animate-modalIn' : 'animate-modalOut'
      ]"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="'modal-title'"
      [attr.aria-describedby]="'modal-body'"
      tabindex="0"
      (keydown.escape)="close()"
    >

        <!-- ========================= Modal Header ========================= -->
        <div
            class="flex items-center justify-between px-4 py-3 border-b"
            [class]="palette().border"
        >
            <h3 id="modal-title" class="font-semibold text-lg">
            {{ title() }}
            </h3>
            @if(showCancelIcon()) {
                <button 
                class="text-xl hover:opacity-85 cursor-pointer transition-colors duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-500 rounded-md"
                [class]="palette().textHover"
                (click)="close()"
                aria-label="Close dialog"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>
            }
        </div>

        <!-- ========================= Modal Body ========================= -->
        <div id="modal-body" class="p-4 scroll max-h-[75vh] scroll-{{ modalStyle() }}">
            <ng-content></ng-content>
        </div>

        <!-- ========================= Modal Footer ========================= -->
        @if (showFooter()) {
            <div
            class="flex justify-end gap-3 p-4 border-t"
            [class]="palette().border"
            >
                @if (cancelMerged().show) {
                    <ZS-button
                    [btnStyle]="cancelMerged().btnStyle"
                    variant="solid"
                    type="button"
                    (clickedEv)="cancelEv.emit()"
                    [icon]="cancelMerged().icon"
                    [disabled]="cancelMerged().disabled"
                    [size]="cancelMerged().size"
                    [variant]="cancelMerged().variant"
                    aria-label="Cancel"
                    >
                        {{ cancelMerged().text}}
                    </ZS-button>
                }
                @if (confirmMerged().show) {
                    <ZS-button
                    type="button"
                    [btnStyle]="confirmMerged().btnStyle"
                    (clickedEv)="confirmEv.emit()"
                    [icon]="confirmMerged().icon"
                    [disabled]="confirmMerged().disabled"
                    [size]="confirmMerged().size"
                    [variant]="confirmMerged().variant"
                    aria-label="Confirm"
                    >
                        {{ confirmMerged().text}}
                    </ZS-button>
                }
            </div>
        }
    </div>
  </div>
}
