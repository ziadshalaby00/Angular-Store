<div tabindex="0" 
  class="inline-flex items-center justify-center gap-2 rounded-full text-sm font-medium
  px-3 h-8 w-fit cursor-pointer"
  [class.bg-green-100]="isOnline()"
  [class.text-green-800]="isOnline()" 
  [class.bg-red-100]="!isOnline()"
  [class.text-red-800]="!isOnline()"
  [class.dark:bg-green-700]="isOnline()"
  [class.dark:text-green-100]="isOnline()"
  [class.dark:bg-red-700]="!isOnline()"
  [class.dark:text-red-100]="!isOnline()"
>
  <i
    class="fa fa-circle text-xs leading-none"
    [class.text-green-500]="isOnline()"
    [class.text-red-500]="!isOnline()"
    aria-hidden="true"
  ></i>
  <span>
    @if (isOnline()) {
      Online
    } @else {
      Offline
    }
  </span>
</div>
