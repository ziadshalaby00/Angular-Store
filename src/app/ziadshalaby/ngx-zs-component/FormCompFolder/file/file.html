<div
  class="flex flex-col gap-2 w-full"
  [class.opacity-60]="disabled()"
  role="group"
  [attr.aria-labelledby]="Id() + '-label'"
  [attr.aria-describedby]="Id() + '-hint ' + Id() + '-error'"
>
  <!-- ========================= Label & Hint ========================= -->
  <ZS-label
    class="mb-1"
    [label]="label()"
    [hint]="hint()"
    [required]="required()"
    [hintId]="Id() + '-hint'"
    [for]="Id()"
    [id]="Id() + '-label'"
  >
  </ZS-label>

  <!-- ================= Input ================= -->
  <div
    [class]="[
      'relative rounded-xl flex flex-col justify-center items-center gap-2 border-2 border-dashed transition-all duration-200',
      palette().border,
      palette().ring,
      palette().borderHover,
      palette().inputBg
    ].join(' ')"
    [class.cursor-pointer]="!disabledOrReadonly()"
    [class.cursor-not-allowed]="disabledOrReadonly()"
    tabindex="0"
    role="button"
    [attr.aria-disabled]="disabledOrReadonly()"
    [attr.aria-label]="placeholder() || 'Upload file'"
    (keydown.enter)="!disabledOrReadonly() && fileInput.click()"
    (keydown.space)="!disabledOrReadonly() && fileInput.click()"
  >
    <input
      #fileInput
      type="file"
      [id]="Id()"
      [name]="iName()"
      [attr.accept]="accept()"
      [attr.multiple]="multiple() ? '' : null"
      [attr.autofocus]="autofocus() ? true : null"
      class="absolute inset-0 opacity-0 cursor-pointer"
      [disabled]="disabledOrReadonly()"
      (change)="handleFileChange($event)"
      [attr.aria-required]="required()"
      [attr.aria-invalid]="!!error().length"
      [attr.aria-describedby]="Id() + '-hint ' + Id() + '-error'"
    />

    <div class="flex flex-col items-center justify-center text-center py-6 pointer-events-none select-none">
      <i class="fa-solid fa-upload text-3xl mb-2" [ngClass]="palette().text" aria-hidden="true"></i>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        {{ placeholder() }}
      </p>
    </div>
  </div>

  <!-- ================= Files Preview ================= -->
  @if (hasFiles()) {
    <div
      class="flex flex-col gap-2 mt-3"
      role="list"
      aria-label="Uploaded files"
    >
      @for (entry of files().entries(); track entry[0]) {
        <div
          class="flex flex-col gap-1 p-2 rounded-lg border focus:outline-none focus:ring-2 focus:ring-offset-2"
          [ngClass]="[palette().border, palette().inputBg]"
          role="listitem"
          tabindex="0"
        >
          <span class="block text-sm font-medium truncate">
            {{ entry[1].name }}
          </span>

          <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-1">
              <i class="text-lg fa-solid fa-file" [ngClass]="palette().text" aria-hidden="true"></i>
              <span class="text-xs text-gray-500">
                {{ formatSize(entry[1].size) }}
              </span>
            </div>

            <div class="flex gap-2">
              @if (allowPreview() && entry[1].url?.startsWith('blob:')) {
                <ZS-button
                  type="button"
                  (clickedEv)="preview(entry[1].url)"
                  [btnStyle]="inputStyle()"
                  size="sm"
                  aria-label="Preview {{ entry[1].name }}"
                >
                  Preview
                </ZS-button>
              }

              @if (!disabledOrReadonly()) {
                <ZS-button
                  type="button"
                  variant="outline"
                  btnStyle="danger"
                  (clickedEv)="removeFile(entry[0])"
                  icon="fa-solid fa-trash"
                  aria-label="Remove {{ entry[1].name }}"
                >
                </ZS-button>
              }
            </div>
          </div>
        </div>
      }
    </div>
  }

  <!-- ========================= Error Messages ========================= -->
  <ZS-input-errors
    [Id]="Id() + '-error'"
    [errors]="[error()]"
    aria-live="assertive"
    role="alert"
  >
  </ZS-input-errors>
</div>
