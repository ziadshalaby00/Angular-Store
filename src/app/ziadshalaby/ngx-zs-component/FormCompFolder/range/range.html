<!-- ========================= Label ========================= -->
<div class="flex flex-col w-full select-none">
  <ZS-label
    [label]="label()"
    [hint]="hint()"
    [hintID]="iId() + '-hint'"
    [for]="iId()"
  ></ZS-label>

  <!-- ========================= Slider Container ========================= -->
  <div class="flex gap-2 items-center">
    
    <!-- ========================= Track ========================= -->
    <div
      #track
      [class]="rangeClasses()"
      (mousedown)="onMouseDown($event)"
    >
      
      <!-- ========================= Track Background ========================= -->
      <div
        class="absolute inset-0 bg-gradient-to-r from-gray-200 to-gray-300 transition-all duration-300 group-hover:brightness-110"
        [ngClass]="['secondary', 'dark'].includes(inputStyle()) ? 'dark:from-gray-500 dark:to-gray-600' : 'dark:from-gray-700 dark:to-gray-800'"
        [class.cursor-not-allowed]="disabledOrReadonly()"
      ></div>

      <!-- ========================= Fill (Progress) ========================= -->
      <div
        class="absolute left-0 top-0 h-full transition-all duration-200 ease-out shadow-sm"
        [style.width.%]="percent()"
        [class]="palette().btnBG"
        [class.cursor-not-allowed]="disabledOrReadonly()"
      ></div>

      <!-- ========================= Thumb (Handle) ========================= -->
      <div
        class="absolute top-1/2 rounded-full flex items-center justify-center -translate-y-1/2 transition-all duration-200 ease-out shadow-md group-hover:scale-110"
        [style.left]="calcThumbPosition()"
        [class.cursor-not-allowed]="disabledOrReadonly()"
        [class]="[
          palette().btnBG,
          dragging() ? 'scale-110 shadow-lg' : '',
          rangeSizeClasses('size')
        ].join(' ')"
        role="slider"
        tabindex="0"
        [attr.id]="iId()"
        [attr.aria-valuemin]="min()"
        [attr.aria-valuemax]="max()"
        [attr.aria-valuenow]="value()"
        [attr.aria-disabled]="disabledOrReadonly() || null"
        [attr.aria-readonly]="isReadonly() || null"
        [attr.aria-labelledby]="iId() + '-label'"
        [attr.aria-describedby]="hint() ? iId() + '-hint' : null"
        aria-orientation="horizontal"
      >
        <i class="fa-solid fa-circle text-[8px] text-white"></i>
      </div>
    </div>

    <!-- ========================= Value Display ========================= -->
    @if (showValue()) {
      <div class="text-sm text-gray-600 dark:text-gray-300 font-medium">
        {{ value() }}
      </div>
    }
  </div>
</div>
