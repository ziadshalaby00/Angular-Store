<!-- ========================= Label ========================= -->
<div class="flex flex-col w-full select-none">
  <ZS-label [class]="(label() || hint()) ? 'mb-1' : ''"
  [label]="label()"
  [hint]="hint()"
  [hintId]="Id() + '-hint'"
  [size]="size()"
  [for]="Id()"
  ></ZS-label>

  <!-- ========================= Slider Container ========================= -->
  <div class="flex items-center"
  [class]="gapCLasses()">
    
    <!-- ========================= Track ========================= -->
    <div
      #track
      [class]="rangeClasses()"
      (mousedown)="onMouseDown($event)"
    >
      
      <!-- ========================= Track Background ========================= -->
      <div
        class="absolute inset-0 rounded-full bg-gradient-to-r from-gray-200 to-gray-300 transition-all duration-300 group-hover:brightness-110"
        [ngClass]="['secondary', 'dark'].includes(inputStyle()) ? 'dark:from-gray-500 dark:to-gray-600' : 'dark:from-gray-700 dark:to-gray-800'"
        [class.cursor-not-allowed]="disabledOrReadonly()"
      ></div>

      <!-- ========================= Fill (Progress) ========================= -->
      <div
        class="absolute left-0 rounded-full top-0 h-full transition-all duration-200 ease-out shadow-sm"
        [style.width.%]="percent()"
        [ngClass]="palette().btnBG + ' ' + palette().btnBGHover"
        [class.cursor-not-allowed]="disabledOrReadonly()"
      ></div>

      <!-- ========================= Thumb (Handle) ========================= -->
      <div
        class="absolute top-1/2 rounded-full flex items-center justify-center -translate-y-1/2 transition-all duration-200 ease-out shadow-md group-hover:scale-110"
        [style.left]="calcThumbPosition()"
        [class.cursor-not-allowed]="disabledOrReadonly()"
        [ngClass]="ThumbClasses()"
        role="slider"
        tabindex="0"
        [attr.id]="Id()"
        [attr.aria-valuemin]="min()"
        [attr.aria-valuemax]="max()"
        [attr.aria-valuenow]="value()"
        [attr.aria-disabled]="disabledOrReadonly() || null"
        [attr.aria-readonly]="isReadonly() || null"
        [attr.aria-labelledby]="Id() + '-label'"
        [attr.aria-describedby]="hint() ? Id() + '-hint' : null"
        aria-orientation="horizontal"
      >
        <i class="fa-solid fa-circle text-white" [class]="dotCLasses()"></i>
      </div>
    </div>

    <!-- ========================= Value Display ========================= -->
    @if (showValue()) {
      <div class="text-sm text-gray-600 dark:text-gray-300 font-medium">
        {{ value() }}
      </div>
    }
  </div>
</div>
