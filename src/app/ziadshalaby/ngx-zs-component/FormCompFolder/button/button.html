<!-- ========================= Button Core Attributes ========================= -->
<button 
  [id]="Id()"
  class="w-full"
  [attr.type]="type()"
  [disabled]="disabled()"
  [class]="['flex gap-2', baseClasses()].join(' ')"

  [attr.aria-disabled]="disabled()"
  [attr.aria-label]="icon() ? (icon() + ' button') : undefined"
  [attr.tabindex]="disabled() ? -1 : 0"

  (click)="onClick($event)"
>
  <!-- ========================= Button Content ========================= -->
  @if (icon()) {
    <i [class]="icon()" aria-hidden="true"></i>
  }
  <ng-content></ng-content>
</button>
