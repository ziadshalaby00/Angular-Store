<!-- ========================= Scroll-to-Top Container ========================= -->
<div
  [ngClass]="positionClass()"
  class="fixed group bottom-4 {{ zIndices.scrollToTop }} transition-opacity duration-300"
  [style.opacity]="scrollY() > 200 ? 1 : 0"
>
  <!-- ========================= Scroll Button ========================= -->
  <button
    (click)="scrollToTop()"
    class="w-12 h-12 group-hover:scale-105 rounded-full flex items-center justify-center relative overflow-hidden focus:outline-none"
    type="button"
    role="button"
    aria-label="Scroll to top"
    title="Scroll to top"
  >
    <!-- ========================= Progress Ring (SVG) ========================= -->
    <svg
      class="absolute inset-0 w-full h-full transform -rotate-90"
      aria-hidden="true"
      focusable="false"
    >
      <!-- Background Circle -->
      <circle
        cx="24"
        cy="24"
        r="22"
        stroke="transparent"
        stroke-width="5"
        fill="currentColor"
        [ngClass]="circleColorClass()"
      />

      <!-- Animated Progress Circle -->
      <circle
        cx="24"
        cy="24"
        r="22"
        stroke="currentColor"
        stroke-width="5"
        fill="transparent"
        [attr.stroke-dasharray]="circleCircumference"
        [attr.stroke-dashoffset]="progressOffset()"
        [ngClass]="arrowProgressColorClass()"
        class="transition-all duration-300 ease-out"
        stroke-linecap="round"
      />
    </svg>

    <!-- ========================= Up Arrow Icon ========================= -->
    <i
      class="fas fa-arrow-up relative z-100 text-lg"
      [ngClass]="arrowProgressColorClass()"
      aria-hidden="true"
    ></i>
  </button>
</div>
