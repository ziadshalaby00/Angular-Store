<label class="z-input w-full block" [attr.for]="id()">

  <!-- Label and Hint -->
  @if(label() || hint()) {
    <div class="mb-1 flex items-center gap-2">
      @if (label()) {
        <span class="text-sm font-semibold truncate">
          {{ label() }} @if (required()) { <span class="text-red-500">*</span> }
        </span>
      }
      @if (hint()) {
        <small class="text-xs text-slate-500 dark:text-slate-400">{{ hint() }}</small>
      }
    </div>
  }

  <!-- Input Container (Field + Icons) -->
  <div
    class="relative flex items-center"
    [class]="containerClasses()"
  >

    <!-- Left Icon -->
    @if (icon()) {
      <i [ngClass]="icon() + ' mr-2 text-base'" aria-hidden="true"></i>
    }

    <!-- Input Field -->
    <input #inputEl
      [id]="id()"
      [name]="name()"
      [attr.type]="actualType"
      [attr.placeholder]="placeholder()"
      [value]="value()"
      [disabled]="disabled() ? true : null"
      [attr.min]="type() === 'number' ? min() : null"
      [attr.max]="type() === 'number' ? max() : null"
      [attr.step]="type() === 'number' ? step() : null"
      [attr.required]="required() ? true : null"
      (input)="onInput($event)"
      (keydown.enter)="onEnter()"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (change)="onChange()"
      [attr.autocomplete]="autocomplete()"
      [attr.maxlength]="maxlength()"
      [attr.minlength]="minlength()"
      [attr.autofocus]="autofocus() ? true : null"
      [attr.readonly]="isReadonly() ? true : null"
      [attr.aria-invalid]="!!error()"
      [attr.inputmode]="inputmode()"
      [spellcheck]="spellcheck()"
      class="flex-1 bg-transparent outline-none text-sm caret-current w-full"
    />

    <!-- Clear Button -->
    @if (showClear()) {
      <button
        type="button"
        (click)="clear()"
        class="ml-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200"
        [attr.aria-label]="'Clear ' + (label() || '')"
      >
        <i class="fa fa-times text-sm" aria-hidden="true"></i>
      </button>
    }

    <!-- Search Icon (for 'search' type or when explicitly enabled) -->
    @if (type() === 'search' || showSearchIcon()) {
      <button
        type="button"
        (click)="onSearch()"
        class="ml-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200"
        [attr.aria-label]="'Search'"
      >
        <i class="fa fa-search text-sm" aria-hidden="true"></i>
      </button>
    }

  </div>

  <!-- Error Messages -->
  @if (error()) {
    <ul class="mt-1 text-xs text-red-500 space-y-1">
      @for (err of error(); track $index) {
        <li class="flex items-center gap-2">
          <i class="fa fa-circle text-[6px]" aria-hidden="true"></i>
          <span>{{ err }}</span>
        </li>
      }
    </ul>
  }

</label>
