<div
  [ngClass]="positionClass()"
  class="fixed bottom-4 z-[500] transition-opacity duration-300"
  [style.opacity]="scrollY() > 200 ? 1 : 0"
>
  <button
    (click)="scrollToTop()"
    class="w-12 h-12 rounded-full flex transparent items-center justify-center relative overflow-hidden"
  >
    <!-- 🌀 Progress Ring (SVG) -->
    <svg class="absolute inset-0 w-full h-full transform -rotate-90">
      <!-- Background Ring -->
      <circle
        cx="24"
        cy="24"
        r="22"
        stroke="transparent"
        stroke-width="5"
        fill="currentColor"
        [ngClass]="circleColorClass()"
      />

      <!-- Progress Ring -->
      <circle
        cx="24"
        cy="24"
        r="22"
        stroke="currentColor"
        stroke-width="5"
        fill="transparent"
        [attr.stroke-dasharray]="circleCircumference"
        [attr.stroke-dashoffset]="progressOffset()"
        [ngClass]="arrowAprogressColorClass()"
        class="transition-all duration-300 ease-out"
        stroke-linecap="round"
      />
    </svg>

    <!-- ⬆️ Arrow Icon -->
    <i
      class="fas fa-arrow-up"
      [ngClass]="[arrowAprogressColorClass(), 'relative z-[100] text-lg']"
    ></i>
  </button>
</div>
