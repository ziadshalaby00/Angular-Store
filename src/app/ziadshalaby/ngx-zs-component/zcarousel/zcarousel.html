<!-- =================================== Main Container =================================== -->
<div 
  class="relative w-full mt-6"
  role="region"
  aria-label="Image carousel"
  aria-roledescription="carousel"
>

  <!-- =================================== Carousel Track =================================== -->
  <div 
    carousel-container
    #carouselContainer
    class="overflow-hidden relative"
    role="group"
    aria-label="Carousel track"
    (pointerdown)="onDragStart($event)"
    (pointermove)="onDragMove($event)"
    (pointerup)="onDragEnd()"
    (pointerleave)="onDragEnd()"
    (pointercancel)="onDragEnd()"
    [class.dragging]="dragging()"
  >
    <div 
      #carouselTrack 
      [style.--carousel-item-width]="itemsPerBoxWidth()"
      class="flex transition-transform duration-500 ease-in-out"
      [style.transform]="'translateX(' + currentTranslate() + 'px)'"
    >
      <!-- Cards -->
      <ng-content select="[carousel-item]"></ng-content>
      <!-- /Cards -->
    </div>
  </div>
  <!-- =================================== /Carousel Track =================================== -->

  <!-- =================================== Navigation Arrows =================================== -->
  @if (arrows()) {
    <button
      type="button"
      class="absolute top-1/2 left-3 size-10 -translate-y-1/2 p-3 flex items-center justify-center rounded-full bg-gray-100/50 hover:bg-gray-100/70 transition shadow-lg-all shadow-lg-all-night"
      (click)="previous()"
      aria-label="Previous slide"
      [attr.aria-controls]="carouselContainer?.id"
    >
      <i [ngClass]="arrowColorClass()" class="fas fa-chevron-left text-xl" aria-hidden="true"></i>
    </button>

    <button
      type="button"
      class="absolute top-1/2 right-3 size-10 -translate-y-1/2 p-3 flex items-center justify-center rounded-full bg-gray-100/50 hover:bg-gray-100/70 transition shadow-lg-all shadow-lg-all-night"
      (click)="next()"
      aria-label="Next slide"
      [attr.aria-controls]="carouselContainer?.id"
    >
      <i [ngClass]="arrowColorClass()" class="fas fa-chevron-right text-xl" aria-hidden="true"></i>
    </button>
  }
  <!-- =================================== /Navigation Arrows =================================== -->

</div>
<!-- =================================== /Main Container =================================== -->


<!-- =================================== Indicators =================================== -->
@if(showIndicators()) {
  <div class="flex justify-center mt-4 space-x-2" role="tablist" aria-label="Carousel indicators">
    @for (item of indicatorBoxes(); track $index; let i = $index) {
      <button
        type="button"
        role="tab"
        class="w-3 h-3 rounded-full transition"
        [ngClass]="currentIndex() === i 
                    ? 'bg-gray-800 dark:bg-gray-200 scale-110' 
                    : 'bg-gray-400 dark:bg-gray-600 hover:bg-gray-600 dark:hover:bg-gray-400'"
        (click)="updateIndex(i)"
        [attr.aria-label]="'Go to slide ' + (i + 1)"
        [attr.aria-current]="currentIndex() === i ? 'true' : null"
        tabindex="0"
      ></button>
    }
  </div>
}
<!-- =================================== /Indicators =================================== -->
