<!-- ========================= Page 404 Container ========================= -->
<div class="flex flex-col items-center justify-center min-h-[90vh]
    text-center text-sky-600 dark:text-sky-500
    transition-colors duration-500 animate-fadeIn">

  <!-- ========================= Icon ========================= --> 
  <div class="text-[136px] mb-8 animate-float opacity-90 leading-none">
    <i class="fa-solid" [class]="icon()"></i>
  </div>

  <!-- ========================= Title ========================= -->
  <h1 class="text-6xl font-black tracking-widest mb-2 
  text-rose-600 dark:text-rose-500 
  drop-shadow-[0_0_8px_rgba(239,68,68,0.5)] select-none">
    404
  </h1>


  <!-- ========================= Message ========================= -->
  <h2 class="text-2xl text-rose-600/80 dark:text-rose-800/80 font-semibold mb-4">
    {{ title() }}
  </h2>
  <p class="text-base max-w-md text-gray-600 dark:text-gray-400 mb-8">
    {{ message() }}
  </p>

  <!-- ========================= Button ========================= -->
  @if (showButton()) {
    <a
      [routerLink]="routerLink()"
      (click)="onAction.emit()"
      class="px-6 py-2 rounded-full
             bg-sky-500 text-white font-medium shadow-md
             hover:bg-sky-600 hover:shadow-lg flex items-center justify-center
             transition-all duration-300 ease-out gap-1.5
             dark:bg-sky-600 dark:hover:bg-sky-500"
    >
      <i class="fa-solid fa-house"></i>
      {{ buttonText() }}
    </a>
  }
</div>
