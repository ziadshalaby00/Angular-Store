<!-- signup.component.html -->
<div class="min-h-[90vh] flex justify-center items-center m-4">
  <ZS-card 
  cardStyle="teal"
  class="w-full max-w-[30rem]"
  >
    <form (submit)="submit($event)" class="p-6 flex flex-col gap-4" novalidate>
        <h2 class="text-2xl text-center font-bold mb-4 text-teal-800 dark:text-teal-300">Sign Up</h2>
  
        <ZS-input
          [label]="'Full Name'"
          [placeholder]="'Enter your full name'"
          icon="fas fa-user"
  
          (changedEv)="changeValues($event, 'fullname')"
          [touched]="form.touched()"
  
          [type]="'text'"
          [required]="true"
          [inputStyle]="'teal'"
        ></ZS-input>
      
        <ZS-input
          [label]="'Username'"
          [hint]="'Enter a unique username.'"
          [placeholder]="'Enter your username'"
          icon="fas fa-user"
  
          (changedEv)="changeValues($event, 'username')"
          [touched]="form.touched()"
  
          [type]="'text'"
          [required]="true"
          [inputStyle]="'teal'"
        ></ZS-input>
      
        <ZS-input
          [label]="'Email'"
          [hint]="'Enter a unique email.'"
          [placeholder]="'Enter your email'"
          icon="fas fa-envelope"
  
          (changedEv)="changeValues($event, 'email')"
          [touched]="form.touched()"
  
          [type]="'email'"
          [required]="true"
          [inputStyle]="'teal'"
        ></ZS-input>
      
        <ZS-input
          [label]="'Password'"
          [placeholder]="'Enter password'"
          icon="fas fa-lock"
  
          (changedEv)="changeValues($event, 'password')"
          [touched]="form.touched()"
  
          [type]="'password'"
          [required]="true"
          [inputStyle]="'teal'"
        ></ZS-input>
      
        <ZS-input
          [label]="'Confirm Password'"
          [placeholder]="'Confirm password'"
          icon="fas fa-lock"
  
          [touched]="form.touched()"
          [validateFn]="confPassValidate"
  
          [type]="'password'"
          [required]="true"
          [inputStyle]="'teal'"
        ></ZS-input>
    
        
        <div class="mt-4 flex flex-col gap-2">
          <ZS-button
          size="lg"
          btnStyle="teal"
          [type]="'submit'"
          [disabled]="this.authService.googleLoading() || this.authService.signupLoading()"
          [icon]="this.authService.signupLoading() ? 'fa fa-spinner fa-spin' : ''"
          >
            Sign Up
          </ZS-button>
  
          <small class="text-gray-800 dark:text-gray-300 text-center">Or</small>
  
          <ZS-button
          (clickedEv)="google()"
          size="lg"
          btnStyle="primary"
          [type]="'button'"
          [disabled]="this.authService.googleLoading() || this.authService.signupLoading()"
          [icon]="this.authService.googleLoading() ? 'fa fa-spinner fa-spin' : 'fa-brands fa-google'"
          >
            Sign Up With Google
          </ZS-button>
        </div>
    
        <div class="flex flex-wrap justify-center items-center gap-1.5 text-sm">
          <span class="text-gray-700 dark:text-gray-300">
            Already have an account?
          </span>
          <button
          type="button"
          class="text-blue-600 hover:text-blue-500 dark:text-blue-400"
          (click)="router.navigate(['/login'])"
          >
          Login
          </button>
        </div>
    </form>
  </ZS-card>
</div>
