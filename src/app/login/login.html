<!-- signup.component.html -->
<div class="min-h-[90vh] flex justify-center items-center m-4">
  <ZS-card 
  class="w-full max-w-[30rem]"
  cardStyle="secondary"
  >
    <form (submit)="submit($event)" class="p-6 flex flex-col gap-4" novalidate>
        <h2 class="text-2xl text-center font-bold mb-4 text-slate-800 dark:text-slate-300">Login</h2>
      
        <ZS-input
          [label]="'Username'"
          [placeholder]="'Enter your username'"
          icon="fas fa-user"
  
          (changedEv)="changeValues($event, 'username')"
          [touched]="form.touched()"
  
          [type]="'text'"
          [required]="true"
          [inputStyle]="'secondary'"
        ></ZS-input>
      
        <ZS-input
          [label]="'Password'"
          [placeholder]="'Enter password'"
          icon="fas fa-lock"
  
          (changedEv)="changeValues($event, 'password')"
          [touched]="form.touched()"
  
          [type]="'password'"
          [required]="true"
          [inputStyle]="'secondary'"
        ></ZS-input>
      
        <div class="mt-4 flex flex-col gap-2">
          <ZS-button
          size="lg"
          btnStyle="dark"
          [type]="'submit'"
          [disabled]="this.authService.googleLoading() || this.authService.loginLoading()"
          [icon]="this.authService.loginLoading() ? 'fa fa-spinner fa-spin' : ''"
          >
            Login
          </ZS-button>
  
          <small class="text-gray-800 dark:text-gray-300 text-center">Or</small>
  
          <ZS-button
          size="lg"
          btnStyle="primary"
          (clickedEv)="google()"
          [type]="'button'"
          icon="fa-brands fa-google"
          [disabled]="this.authService.googleLoading() || this.authService.loginLoading()"
          [icon]="this.authService.googleLoading() ? 'fa fa-spinner fa-spin' : 'fa-brands fa-google'"
          >
            Login With Google
          </ZS-button>
        </div>
    
        <div class="flex flex-col gap-1.5  text-sm">
          <div class="flex flex-wrap justify-center items-center gap-1.5">
              <span class="text-gray-700 dark:text-gray-300">
                Forgot
              </span>
              <button
              type="button"
              class="text-blue-600 hover:text-blue-500 dark:text-blue-400"
              (click)="passwordResetModal.set(true)"
              >
              Passowrd?
              </button>
          </div>
  
          <div class="flex flex-wrap justify-center items-center gap-1.5">
              <span class="text-gray-700 dark:text-gray-300">
                Don’t have an account?
              </span>
              <button
              type="button"
              class="text-teal-600 hover:text-teal-500 dark:text-teal-400"
              (click)="router.navigate(['/signup'])"
              >
              Sign Up
              </button>
          </div>
        </div>
  
    </form>
  </ZS-card>
</div>

<!-- Forgot Password Modal -->
<ZS-modal
title="Forgot Password"
modalStyle="primary"
[showFooter]="true"
position="center"
(cancelEv)="passwordResetModal.set(false)"
(confirmEv)="confirmPasswordReset()"

[confirmConfig]="{
  icon: authService.passwordResetLoading() ? 'fa fa-spinner fa-spin' : null,
  disabled: authService.passwordResetLoading() ? true : false
}"
[cancelConfig]="{
  disabled: authService.passwordResetLoading() ? true : false
}"
[showCancelIcon]="authService.passwordResetLoading() ? false : true"

[(open)]="passwordResetModal"
[closeOnOverlay]="authService.passwordResetLoading() ? false : true"
>
  <p class="text-sm dark:text-gray-100 mb-2">
    Enter your 
    <span class="font-semibold">email address</span> 
    and we’ll send you a link to 
    <span class="font-semibold">reset your password.</span>
  </p>
  <ZS-input
  inputStyle="primary"
  type="email"
  [placeholder]="'Enter your email'"
  icon="fas fa-envelope"
  [required]="true"

  [touched]="passwordResetForm.touched()"
  (changedEv)="chanegEmailValue($event)"
  >
  </ZS-input>
</ZS-modal>
