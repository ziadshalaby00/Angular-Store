<div class="min-h-[90vh] flex justify-center items-center m-4">
  <ZS-card
  cardStyle="violet"
  class="w-full max-w-md"
  >
    <form (submit)="submit($event)" novalidate class="p-6 flex flex-col gap-4">
        <h2 class="text-2xl text-center font-bold mb-4 text-slate-800 dark:text-slate-300">Reset Password</h2>
      
         <ZS-input #pass
          [label]="'New Password'"
          [placeholder]="'Enter password'"
          icon="fas fa-lock"
  
          (changedEv)="changeValues($event, 'new_password')"
          [touched]="form.touched()"
  
          [type]="'password'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
      
        <ZS-input #conf_pass
          [label]="'Confirm Password'"
          [placeholder]="'Confirm password'"
          icon="fas fa-lock"
  
          (changedEv)="changeValues($event, 'conf_pass')"
          [touched]="form.touched()"
          [validateFns]="[confPassValidate]"
  
          [type]="'password'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
  
      <ZS-button
      size="lg"
      btnStyle="violet"
      [type]="'submit'"
      [disabled]="this.authService.passwordResetConfirmLoading()"
      [icon]="this.authService.passwordResetConfirmLoading()? 'fa fa-spinner fa-spin' : ''"
      >
          Reset
      </ZS-button>
    </form>
  </ZS-card>
</div>
